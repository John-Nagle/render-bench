[package]
name = "render-bench"
version = "0.6.2"
authors = ["John Nagle <nagle@animats.com>"]
edition = "2021"

[features]
#   Feature "tracy" enables profiing with Tracy
tracy = ["tracy-client", "profiling/profile-with-tracy"]

[dependencies]
#   Rendering-related
env_logger = { version = "0.9", default-features = false, features = ["termcolor", "atty"] }
histogram = "0.6.9"
pico-args = "0.4"
pollster = "0.2.4"
profiling = { version = "1", default-features = false }

#   Now using Rend3-hp.
rend3 = { version = "^0.23.0", git = 'https://github.com/John-Nagle/rend3-hp', branch = "wgpu23safe" }
rend3-egui = { version = "^0.23.0", git = 'https://github.com/John-Nagle/rend3-hp', branch = "wgpu23safe" }
rend3-framework = { version = "^0.23.0", git = 'https://github.com/John-Nagle/rend3-hp', branch = "wgpu23safe" }
rend3-routine = { version = "^0.23.0", git = 'https://github.com/John-Nagle/rend3-hp', branch = "wgpu23safe" }
# Winit integration with egui (turn off the clipboard feature)
egui-winit = { version = "0.29", default-features = false, features = ["links", "wayland"] }

#   Try to get rid of this. It's only used for one texture enum.	
## wgpu = "0.19"
# Importing png's
image = { version = "0.24.3", default-features = false, features = ["png", "jpeg"] }

glam = { version = "0.28", features = ["bytemuck", "serde"]}
#   Embedding shaders. This forces shaders to be compiled into the executable
#   rather than loaded at run time. That's because rust-embed won't work cross platoform
#   where source and target file systems are different. Version must match that used in rend3 so 
#   that feature merging takes place.
rust-embed = { version = "6", features = ["debug-embed"]}
winit = "0.30"
#   End of Rend3 compatibilty section.
#### web-sys = "0.3.61"


rustc-hash = "1"
smallvec = "1"
tracy-client = {version = "0.17", optional = true }
#### wgpu-profiler = "0.8.0"
wgpu-profiler = "0.18"

#   Others
argparse = "0.2.2"
num = "0.4.0"
obj = "0.10.2"
tracing = { version = "0.1", default-features = false, features = ["std"] }
sha3 = "0.9.1"
generic-array = "0.14.4"
log = "0.4.14"
## simplelog = "0.10.0"
simplelog = { version = "*", default-features = false }
anyhow = "1.0"
indoc = "1.0"
cfg-if = "1.0"

[workspace.dependencies]
wgpu = "23"

[patch.crates-io]
# wgpu = { git = "https://github.com/John-Nagle/wgpu.git"}

rend3 = { version = "^0.23.0", git = 'https://github.com/John-Nagle/rend3-hp', branch = "wgpu23safe" }
rend3-egui = { version = "0.23.0", git = 'https://github.com/John-Nagle/rend3-hp', branch = "wgpu23safe" }
rend3-framework = { version = "0.23.0", git = 'https://github.com/John-Nagle/rend3-hp', branch = "wgpu23safe" }
rend3-routine = { version = "0.23.0", git = 'https://github.com/John-Nagle/rend3-hp', branch = "wgpu23safe" }
range-alloc = { git = "https://github.com/gfx-rs/range-alloc.git" }

wgpu-profiler = { version = "^0.18.3", git = 'https://github.com/John-Nagle/wgpu-profiler' }

egui = { version = "0.29.1", git = 'https://github.com/emilk/egui.git'}
egui-wgpu = { version = "0.29.1", git = 'https://github.com/emilk/egui.git'}
epaint = { version = "0.29.1", git = 'https://github.com/emilk/egui.git' }
emath = { version = "0.29.1", git = 'git+https://github.com/emilk/egui.git' }
